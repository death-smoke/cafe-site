global
    log stdout format raw local0
    maxconn 2000

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client  30s
    timeout server  30s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold other      5s
    hold refused    5s
    hold nx         5s
    hold timeout    5s
    hold valid      5s
    hold obsolete   5s

frontend fe_api
    bind *:${HAPROXY_PORT}
    default_backend be_api

backend be_api
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    server-template app 1-20 ${BACKEND_HOST}:${BACKEND_PORT} check resolvers docker init-addr libc,none
